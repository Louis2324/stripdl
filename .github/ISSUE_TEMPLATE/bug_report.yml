name: Bug report
description: Report a reproducible problem in Strip or stripdl.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include private library paths,
        credentials, or downloaded content.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Strip version
      placeholder: 0.5.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - Windows ARM64
        - macOS Intel
        - macOS Apple Silicon
        - Linux x64
        - Linux ARM64
        - CLI only
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or diagnostics
      description: Paste relevant errors. Remove private paths, URLs, and credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private or sensitive information from this report.
          required: true
